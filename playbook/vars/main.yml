---
# Valores por defecto de project-zomboid-server-install.yml. Reemplazar con --extra-vars.
# -------------------------------------------------------------------------
# Host / cuenta
# -------------------------------------------------------------------------
pz_user: pzserver
pz_home: "/home/{{ pz_user }}"

# pzsvrtool: se fija la versión de la herramienta; las actualizaciones del juego se gestionan aparte.
pzsvrtool_version: "1.7.3"
pzsvrtool_deb_url: >-
  https://github.com/Lu5ck/pzsvrtool/releases/download/{{ pzsvrtool_version }}/pzsvrtool.x86_64.deb
pzsvrtool_deb_path: "/tmp/pzsvrtool-{{ pzsvrtool_version }}.deb"
# Con el checksum, un .deb ya descargado no se vuelve a pedir (reaprovisionar no depende de
# GitHub) y uno alterado se rechaza. Actualizarlo junto con pzsvrtool_version.
pzsvrtool_deb_sha256: "175744fdd3004bf1992419f593bbbb91ee83aaded798078b5e7f40f9e8238d62"

# -------------------------------------------------------------------------
# Project Zomboid
# -------------------------------------------------------------------------
# Sin espacios. Cambiarlo después selecciona/crea otro mundo de PZ.
pz_server_name: zomboid

# Cadena vacía = rama estable/pública de Steam.
# Ejemplo de valor beta: "42.19"
pz_branch: ""

# Admin root que usa pzsvrtool al iniciar el servidor.
# Vacía = generar una contraseña aleatoria en la primera ejecución y guardarla en
# pz_admin_password_file. Un valor provisto (--extra-vars / Vault) tiene que tener
# >= 12 caracteres, no ser un valor débil conocido y no contener espacios ni '='.
pz_admin_name: pzadmin
pz_admin_password: ""
pz_admin_password_file: "{{ pz_home }}/pzsvrtool/.admin_password"
pz_admin_password_denylist:
  - test
  - password
  - admin
  - changeme
  - pzadmin
  - CHANGE_ME_USE_ANSIBLE_VAULT

# Contraseña de ingreso de los jugadores (Password= del .ini), distinta de la de admin.
# Vacía = generar una aleatoria (24 caracteres) la primera vez y guardarla en
# pz_join_password_file. pz_join_password_rotate=true genera una nueva (reinicia el juego).
pz_join_password: ""
pz_join_password_file: "{{ pz_home }}/pzsvrtool/.join_password"
pz_join_password_rotate: false

# Heap máximo de Java (-Xmx, MiB) que se escribe en ProjectZomboid64.json (también tras
# cada actualización). Terraform pasa su valor. La RAM mínima utilizable del host es
# heap + margen (SO, memoria nativa de Java, pzsvrtool); la swap no cuenta.
pz_java_xmx_mb: 4096
pz_host_overhead_mb: 3072

# Swap de emergencia: no reemplaza RAM.
pz_swap_file: /swapfile
pz_swap_size_gb: 2

# Comportamiento de pzsvrtool
pz_shutdown_countdown_minutes: 5
pz_backup_enabled: true
pz_backup_limit: 10
pz_discord_webhook: ""

# -------------------------------------------------------------------------
# Firewall
# -------------------------------------------------------------------------
pz_manage_ufw: true
pz_ssh_port: 22
pz_udp_ports:
  - 16261
  - 16262
  - 8766

# -------------------------------------------------------------------------
# Actualizaciones automáticas de PZ
# -------------------------------------------------------------------------
pz_auto_update_enabled: true

# El timer chequea periódicamente, pero el mantenimiento solo EMPIEZA dentro de esta ventana.
# Admite ventanas normales (03:00-06:00) y que cruzan la medianoche
# (23:00-02:00).
pz_update_window_start: "03:00"
pz_update_window_end: "06:00"
pz_update_timezone: "America/Argentina/Buenos_Aires"

# Cada cuánto se consulta Steam. Fuera de la ventana el chequeo sale enseguida.
pz_update_check_minutes: 15

# Aviso a los jugadores antes de apagar por una actualización real del juego.
pz_update_countdown_minutes: 5

# Tiempo máximo de espera para que termine el apagado ordenado.
pz_update_shutdown_timeout_minutes: 20

# -------------------------------------------------------------------------
# Requisitos básicos del host
# -------------------------------------------------------------------------
pz_min_ram_mb: "{{ (pz_java_xmx_mb | int) + (pz_host_overhead_mb | int) }}"
pz_min_vcpus: 2

# -------------------------------------------------------------------------
# Configuración del servidor (ini, SandboxVars, spawns), subida por el operador
# -------------------------------------------------------------------------
# true = no iniciar el juego hasta tener configuración (Terraform pasa true por defecto):
# el primer arranque crea el mundo con el Map= que haya, así que tiene que ser el correcto.
pz_wait_for_config: false
pz_helper_dir: "{{ pz_home }}/pzsvrtool"
pz_files_dir: "{{ playbook_dir }}/files"
# Prefijo para correr los helpers como pz_user (los tests lo dejan vacío).
pz_as_user: ["runuser", "-u", "{{ pz_user }}", "--"]
pz_server_config_dir: "{{ pz_home }}/Zomboid/Server"
pz_world_dir: "{{ pz_home }}/Zomboid/Saves/Multiplayer/{{ pz_server_name }}"
pz_config_stage_dir: "{{ pz_home }}/pzsvrtool/config-staged"
pz_config_render_dir: "{{ pz_home }}/pzsvrtool/config-rendered"
pz_config_state_file: "{{ pz_home }}/pzsvrtool/config-applied.json"
pz_config_backup_dir: "{{ pz_home }}/pzsvrtool/config-backups"
pz_config_backup_keep: 10
# false solo en los tests offline (sin systemd de usuario).
pz_manage_service: true
# Espera máxima del apagado ordenado antes de aplicar cambios (cuenta regresiva de 3 min de pzsvrtool).
pz_stop_timeout_seconds: 600
