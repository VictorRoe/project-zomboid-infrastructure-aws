---
# Contraseña de ingreso de los jugadores (Password= del .ini), distinta de la de admin.
# Igual que la de admin: el archivo es la fuente de verdad; se genera una vez (o se
# provee) y se reutiliza, también en un disco restaurado. pz_join_password_rotate=true
# genera una nueva.
- name: Check for stored join password
  ansible.builtin.stat:
    path: "{{ pz_join_password_file }}"
  register: pz_join_password_stat

- name: Store supplied, generated or rotated join password
  ansible.builtin.copy:
    dest: "{{ pz_join_password_file }}"
    content: >-
      {{ pz_join_password if pz_join_password | length > 0
         else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}
    owner: "{{ pz_user }}"
    group: "{{ pz_user }}"
    mode: "0600"
  when: >-
    pz_join_password | length > 0
    or pz_join_password_rotate | bool
    or not pz_join_password_stat.stat.exists
  no_log: true

- name: Enforce join password file permissions
  ansible.builtin.file:
    path: "{{ pz_join_password_file }}"
    owner: "{{ pz_user }}"
    group: "{{ pz_user }}"
    mode: "0600"

- name: Read join password
  ansible.builtin.slurp:
    src: "{{ pz_join_password_file }}"
  register: pz_join_password_slurp
  no_log: true

- name: Set effective join password
  ansible.builtin.set_fact:
    pz_join_password_effective: "{{ pz_join_password_slurp.content | b64decode | trim }}"
  no_log: true

- name: Join password must differ from the admin password
  ansible.builtin.assert:
    quiet: true
    that:
      - pz_join_password_effective | length >= 12
      - pz_join_password_effective != pz_admin_password_effective
    fail_msg: >-
      La contraseña de ingreso guardada en {{ pz_join_password_file }} tiene que tener
      al menos 12 caracteres y ser distinta de la de admin.
