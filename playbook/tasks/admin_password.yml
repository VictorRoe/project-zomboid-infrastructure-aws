---
# El archivo de contraseña es la fuente de verdad: se escribe una vez al generarla
# (y se reutiliza después, p. ej. en un disco restaurado) o se sobrescribe si se provee.
- name: Check for stored admin password
  ansible.builtin.stat:
    path: "{{ pz_admin_password_file }}"
  register: pz_admin_password_stat

- name: Store supplied or generated admin password
  ansible.builtin.copy:
    dest: "{{ pz_admin_password_file }}"
    content: >-
      {{ pz_admin_password if pz_admin_password | length > 0
         else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}
    owner: "{{ pz_user }}"
    group: "{{ pz_user }}"
    mode: "0600"
  when: pz_admin_password | length > 0 or not pz_admin_password_stat.stat.exists
  no_log: true

- name: Enforce admin password file permissions
  ansible.builtin.file:
    path: "{{ pz_admin_password_file }}"
    owner: "{{ pz_user }}"
    group: "{{ pz_user }}"
    mode: "0600"

- name: Read admin password
  ansible.builtin.slurp:
    src: "{{ pz_admin_password_file }}"
  register: pz_admin_password_slurp
  no_log: true

- name: Set effective admin password
  ansible.builtin.set_fact:
    pz_admin_password_effective: "{{ pz_admin_password_slurp.content | b64decode | trim }}"
  no_log: true
