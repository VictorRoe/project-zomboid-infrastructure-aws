---
# Validación de variables. `quiet` (no no_log) mantiene visible fail_msg; la salida
# del assert lista las expresiones, nunca el valor de la contraseña.
- name: Validate server and update variables
  ansible.builtin.assert:
    quiet: true
    that:
      - pz_server_name is match('^[A-Za-z0-9._-]+$')
      - pz_admin_name | length > 0
      - pz_update_window_start is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - pz_update_window_end is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
      - pz_update_check_minutes | int >= 5
      - pz_update_countdown_minutes | int >= 1
    fail_msg: Revisar las variables de servidor/admin/actualización.

- name: Validate supplied admin password
  ansible.builtin.assert:
    quiet: true
    that:
      - pz_admin_password | length >= 12
      - (pz_admin_password | lower) not in (pz_admin_password_denylist | map('lower') | list)
      - not (pz_admin_password is search('\\s'))
      - "'=' not in pz_admin_password"
    fail_msg: >-
      pz_admin_password tiene que tener al menos 12 caracteres, no ser un valor
      débil conocido y no contener espacios ni '=' (formato de config de pzsvrtool).
      Dejarla vacía para generar una contraseña aleatoria.
  when: pz_admin_password | length > 0
