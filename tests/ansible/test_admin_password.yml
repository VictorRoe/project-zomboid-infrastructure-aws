---
# Runs the playbook's validation and admin-password tasks on localhost as the
# current user (no root, no AWS). run.sh passes pz_user/pz_home via -e.
- name: Test admin password validation and persistence
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../playbook/vars/main.yml

  tasks:
    - name: Validate variables
      ansible.builtin.import_tasks: ../../playbook/tasks/validate.yml

    - name: Create pzsvrtool directory
      ansible.builtin.file:
        path: "{{ pz_home }}/pzsvrtool"
        state: directory
        mode: "0700"

    - name: Resolve admin password
      ansible.builtin.import_tasks: ../../playbook/tasks/admin_password.yml

    - name: Report effective password length (never the value)
      ansible.builtin.debug:
        msg: "EFFECTIVE_LEN={{ pz_admin_password_effective | length }}"
